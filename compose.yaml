services:
  app:
    build: .
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8000}
      APP_MODE: ${APP_MODE:-simulated}
      DATABASE_PATH: /data/orders-${APP_MODE:-simulated}.sqlite3
      YOOKASSA_MCP_TOKEN: ${YOOKASSA_MCP_TOKEN:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      MERCHANT_SETUP_KEY: ${MERCHANT_SETUP_KEY:-}
      MERCHANT_VAULT_KEY: ${MERCHANT_VAULT_KEY:-}
      COFFEE_OWNER_CODE: ${COFFEE_OWNER_CODE:-}
      MODEL_SESSION_LIMIT: ${MODEL_SESSION_LIMIT:-25}
      MODEL_MERCHANT_LIMIT: ${MODEL_MERCHANT_LIMIT:-60}
      MODEL_INSTANCE_LIMIT: ${MODEL_INSTANCE_LIMIT:-120}
      MODEL_PARALLEL_LIMIT: ${MODEL_PARALLEL_LIMIT:-8}
      OPENROUTER_OAUTH_ENABLED: ${OPENROUTER_OAUTH_ENABLED:-0}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      MCP_INVOICES_ENABLED: ${MCP_INVOICES_ENABLED:-0}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-465}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      ACCOUNT_AUTH_ENABLED: ${ACCOUNT_AUTH_ENABLED:-0}
      SOCIAL_AUTH_JSON: ${SOCIAL_AUTH_JSON:-}
      MAX_BOT_NAME: ${MAX_BOT_NAME:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
    volumes:
      - order_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  swagger:
    image: swaggerapi/swagger-ui:v5.31.0@sha256:080804ac62c9d5d358662cc6f0db96ba0be76af7af393014a1a1305d967298cc
    ports:
      - '127.0.0.1:8081:8080'
    environment:
      SWAGGER_JSON: /app/openapi.yaml
      CORS: 'false'
      LAYOUT: BaseLayout
      SUPPORTED_SUBMIT_METHODS: '[]'
      TRY_IT_OUT_ENABLED: 'false'
      VALIDATOR_URL: 'none'
      QUERY_CONFIG_ENABLED: 'false'
    volumes:
      - type: bind
        source: ./contracts/openapi.yaml
        target: /app/openapi.yaml
        read_only: true
        bind:
          create_host_path: false
volumes:
  order_data:
