services:
  swagger:
    image: swaggerapi/swagger-ui:v5.31.0@sha256:080804ac62c9d5d358662cc6f0db96ba0be76af7af393014a1a1305d967298cc
    ports:
      - '127.0.0.1:8081:8080'
    environment:
      SWAGGER_JSON: /app/openapi.yaml
      CORS: 'false'
      LAYOUT: BaseLayout
      SUPPORTED_SUBMIT_METHODS: '[]'
      TRY_IT_OUT_ENABLED: 'false'
      VALIDATOR_URL: 'none'
      QUERY_CONFIG_ENABLED: 'false'
    volumes:
      - type: bind
        source: ./contracts/openapi.yaml
        target: /app/openapi.yaml
        read_only: true
        bind:
          create_host_path: false
